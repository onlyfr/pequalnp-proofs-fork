name: Verify refutation
on:
  push:
    branches: [refute-L-meta-3314]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build proof
        working-directory: lean
        run: |
          lake exe cache get
          lake build PEqualNP.Outside.PrivateThreeGateDrop PEqualNP.Outside.PrivateTwoGateDrop PEqualNP.Outside.PrivateReaderDrop PEqualNP.Outside.PrivateParity PEqualNP.Outside.PrivateLineAudit PEqualNP.Outside.Refute_meta_3314 PEqualNP.Outside.IncidenceExtension PEqualNP.Outside.PrivateLinePoints
          printf '%s\n' 'import PEqualNP.Outside.PrivateParity' 'import PEqualNP.Outside.PrivateThreeGateDrop' '#print axioms Onlyfr.PrivateThreeGateDrop.hdrop_of_readers' '#print axioms Onlyfr.PrivateThreeGateDrop.hdrop_concurrent' '#print axioms Onlyfr.PrivateThreeGateDrop.save_exclusive_partner' '#print axioms Onlyfr.PrivateTwoGateDrop.hdrop_le_200' '#print axioms Onlyfr.PrivateTwoGateDrop.two_gate_drop' '#print axioms Onlyfr.PrivateReaderDrop.save_readers' '#print axioms Onlyfr.PrivateReaderDrop.save_and_reader' '#print axioms Onlyfr.PrivateParity.hdrop_199' '#print axioms Onlyfr.PrivateGateDrop.one_input' '#print axioms Onlyfr.PrivateGateDrop.many_inputs' '#print axioms Onlyfr.PrivateIncidenceDrop.private_points_save' '#print axioms Onlyfr.PrivateDropSmall.hdrop_small' '#print axioms Onlyfr.PrivateLineAudit.no_private_plane' > /tmp/hdrop-audit.lean
          lake env lean /tmp/hdrop-audit.lean
          lake build PEqualNP.Outside.R_meta_2664_27 checklemma
          printf '%s\n' '∀ (q n : ℕ) (I : Fin n → Fin n → Prop) [DecidableRel I] (D : PEqualNP.CircuitLowerBounds.Circuit), 199 ≤ q → n = q ^ 2 + q + 1 → (∀ l : Fin n, Fintype.card {p : Fin n // I p l} = q + 1) → (∀ p r : Fin n, p ≠ r → ∃! l : Fin n, I p l ∧ I r l) → PEqualNP.MetaComplexity.Monotone2 D → D.output < n+n+D.size → (∀ (j : ℕ) (g : PEqualNP.CircuitLowerBounds.Gate), D.gates[j]? = some g → ∃ u v : ℕ, g.inputs = [u,v] ∧ u < v ∧ v < n+n+j) → (∀ p l : Fin n, I p l → PEqualNP.MetaComplexity.circuitFun (n+n) D (fun z => decide (z = Fin.castAdd n p ∨ z = Fin.natAdd n l)) = true) → (∀ x : Fin (n+n) → Bool, (¬ ∃ p l : Fin n, I p l ∧ x (Fin.castAdd n p) = true ∧ x (Fin.natAdd n l) = true) → PEqualNP.MetaComplexity.circuitFun (n+n) D x = false) → ∀ T : Finset ℕ, (∀ (j : ℕ) (g : PEqualNP.CircuitLowerBounds.Gate), D.gates[j]? = some g → g.op = PEqualNP.CircuitLowerBounds.GateOp.and → j ∉ T → ¬ ((∀ w ∈ g.inputs, ∃ y : Fin n → Bool, (D.wires (List.ofFn y ++ List.replicate n false)).getD w false ≠ (D.wires (List.ofFn y ++ List.replicate n true)).getD w false) ∨ ∀ w ∈ g.inputs, ∃ y : Fin n → Bool, (D.wires (List.replicate n false ++ List.ofFn y)).getD w false ≠ (D.wires (List.replicate n true ++ List.ofFn y)).getD w false)) → 100 * T.card < n * q → n * q ≤ 100 * D.size' > /tmp/expected-statement.txt
          lake exe checklemma PEqualNP.Outside.R_meta_2664_27 /tmp/expected-statement.txt reduce
