          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build proof
        working-directory: lean
        run: |
          lake exe cache get
          lake build PEqualNP.Outside.PrivateGridCharges PEqualNP.Outside.PrivateGridCuts PEqualNP.Outside.PrivateGrid1009 PEqualNP.Outside.PrivateGridAverage PEqualNP.Outside.PrivateGridMatching PEqualNP.Outside.PrivateGridCompose PEqualNP.Outside.PrivateGridProbe PEqualNP.Outside.PrivateGridMarginal PEqualNP.Outside.PrivateConcurrency PEqualNP.Outside.PrivateArcExact PEqualNP.Outside.PrivateDistinctSupports PEqualNP.Outside.PrivateArcMarginal PEqualNP.Outside.PrivateFanoutBudget PEqualNP.Outside.PrivateForestLift PEqualNP.Outside.PrivateGeneralDrop PEqualNP.Outside.PrivateThreeGateDrop PEqualNP.Outside.PrivateTwoGateDrop PEqualNP.Outside.PrivateReaderDrop PEqualNP.Outside.PrivateParity PEqualNP.Outside.PrivateLineAudit PEqualNP.Outside.Refute_meta_3314 PEqualNP.Outside.IncidenceExtension PEqualNP.Outside.PrivateLinePoints
